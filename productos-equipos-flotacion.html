<!DOCTYPE html>

<html lang="es">



<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <meta name="description" content="In Hole Solutions">

  <link href="assets/images/favicon/favicon.png" rel="icon">

  <title>In Hole Solutions | Productos | Equipos de Flotación</title>

  <link rel="stylesheet"

    href="https://fonts.googleapis.com/css?family=Roboto:400,500,700%7cTeko:400,500,600,700&display=swap">

  <link rel="stylesheet" href="assets/css/libraries.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" type="text/css" href="assets/css/hoja_estilo.css">

</head>



<body>

  <div class="wrapper">
    <div id="header-componente"></div>
    <!-- ========================

       page title 

    =========================== -->

    <section id="page-title" class="page-title page-title-layout12 bg-gray bg-floating-products">

      <div class="container">

        <div class="row">

          <div class="col-sm-12 col-md-12 col-lg-6 ">

            <h1 class="pagetitle__heading">Equipos de Flotación</h1>

          </div><!-- /.col-lg-8 -->

        </div><!-- /.row -->

      </div><!-- /.container -->

    </section><!-- /.page-title -->



    <!-- ======================

      Galeria de productos de flotación

    ========================= -->



    <section class="container">

      <div class="row gallery">

        <div class="col-lg-4 col-md-5 col-xs-7 thumb">

          <a href="productos-equipos-flotacion-357-catalog.html">

            <figure>

              <img class="img-fluid img-thumbnail" src="assets/images/sliders/cople.png" alt="357 Magnum Valve">

            </figure>

          </a>

        </div>

    

        <div class="col-lg-4 col-md-5 col-xs-7 thumb">

          <a href="productos-equipos-flotacion-338-catalog.html">

            <figure><img class="img-fluid img-thumbnail" src="assets/images/sliders/VALVULA AUTOLLENADO02.png" alt="Random Image"></figure>

          </a>

        </div>

    

        <div class="col-lg-4 col-md-5 col-xs-7 thumb">

          <a href="productos-equipos-flotacion-762-catalog.html">

            <figure><img class="img-fluid img-thumbnail" src="assets/images/sliders/tapones.png" alt="Random Image"></figure>

          </a>

        </div>

        

      </div>

    </section>
    <div id="footer-componente"></div>
    <div class="module__search-container">

      <i class="fa fa-times close-search"></i>

      <form class="module__search-form">

        <input type="text" class="search__input" placeholder="Escribe alguna palabra y presiona enter para buscar">

        <button class="module__search-btn"><i class="fa fa-search"></i></button>

      </form>

    </div><!-- /.module-search-container -->



  </div><!-- /.wrapper -->



  <script src="assets/js/jquery-3.3.1.min.js"></script>

  <script src="assets/js/plugins.js"></script>

  <script src="assets/js/main.js"></script>

  <script>
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('header-componente').innerHTML = html;

        // Ahora sí el header existe, activamos los triggers
        const triggers = document.querySelectorAll('.mobile-trigger');
        triggers.forEach(trigger => {
          trigger.addEventListener('click', function (e) {
            if (window.innerWidth < 992) {
              e.preventDefault();
              e.stopPropagation();

              const subMenu = this.closest('.nav__item').querySelector('.dropdown-menu');

              if (subMenu.classList.contains('show')) {
                subMenu.classList.remove('show');
              } else {
                document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
                subMenu.classList.add('show');
              }
            }
          });
        });
      });

    fetch('footer.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('footer-componente').innerHTML = html;
      });
  </script>
</body>



</html>
