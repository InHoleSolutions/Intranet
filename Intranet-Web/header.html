<!-- ── HEADER ── -->
<header class="bg-white border-b border-slate-200 fixed top-0 left-0 right-0 z-[60] glass-nav">
  <!--
    Alturas por breakpoint:
    móvil  (< sm  / < 640px)  : h-14  = 56px
    tablet (sm–md / 640–1024px): h-16  = 64px
    desktop(lg+   / 1024px+)  : h-16  = 64px
    xl+    (1280px+)           : h-16  = 64px
    3xl+   (1920px+)           : h-20  = 80px
  -->
  <div class="max-w-[1440px] 3xl:max-w-[1800px] 4xl:max-w-[2400px] mx-auto
              px-4 sm:px-6 3xl:px-12
              h-14 sm:h-16 3xl:h-20
              flex justify-between items-center">

    <!-- ── Logo + título ── -->
    <div class="flex items-center gap-3 sm:gap-5 cursor-pointer" onclick="mostrarInicio()">
      <img src="../assets/images/logo/logo-dark.svg"
           alt="In Hole Solutions"
           class="h-7 sm:h-9 md:h-10 3xl:h-12 w-auto">
      <div class="hidden sm:block h-6 w-[1px] bg-slate-200"></div>
      <span class="hidden sm:block text-slate-500 font-medium
                   text-[10px] md:text-xs 3xl:text-sm
                   tracking-wide uppercase">
        Intranet Corporativa
      </span>
    </div>

    <!-- ── Lado derecho ── -->
    <div class="flex items-center gap-3 sm:gap-4 lg:gap-6">

      <!-- Bienvenida: visible sm+ -->
      <div class="text-right hidden sm:block">
        <p id="user-welcome" class="text-slate-800 font-semibold text-xs md:text-sm">Cargando...</p>
        <p id="user-rol-label" class="text-slate-400 text-[10px] font-medium uppercase tracking-tighter">Miembro del Equipo</p>
      </div>

      <!-- Botón hamburguesa (solo < lg) -->
      <button onclick="toggleMenu('mobile-nav')"
              class="lg:hidden bg-slate-50 text-slate-600
                     h-9 w-9 sm:h-10 sm:w-10
                     rounded-xl border border-slate-200
                     flex items-center justify-center
                     transition-colors hover:bg-slate-100">
        <i class="fas fa-bars text-sm"></i>
      </button>

      <!-- Botón cerrar sesión -->
      <button onclick="cerrarSesion()"
              class="bg-slate-50 hover:bg-red-50
                     text-slate-400 hover:text-red-600
                     h-9 w-9 sm:h-10 sm:w-10
                     rounded-xl border border-slate-200
                     transition-all flex items-center justify-center shadow-sm">
        <i class="fas fa-sign-out-alt text-sm"></i>
      </button>
    </div>
  </div>
</header>

<!-- ── NAV ──
  top debe igualar la altura del header en cada breakpoint:
  móvil  : top-14 (56px)  — pero el nav está oculto en móvil
  sm–md  : top-16 (64px)
  lg+    : top-16 (64px)  — aquí se muestra como barra horizontal
  3xl+   : top-20 (80px)
-->
<nav id="mobile-nav"
     class="hidden lg:block bg-red-700 shadow-lg
            fixed top-14 sm:top-16 3xl:top-20
            left-0 right-0 z-[70]
            transition-all duration-200">

  <div class="max-w-[1440px] 3xl:max-w-[1800px] 4xl:max-w-[2400px] mx-auto
              px-4 sm:px-6">

    <!-- Links: columna en móvil/tablet, fila en lg+ -->
    <div class="flex flex-col lg:flex-row
                justify-center items-stretch lg:items-center
                lg:h-12 xl:h-14
                space-y-0 lg:space-y-0 lg:space-x-2 xl:space-x-6
                py-2 lg:py-0">

      <a href="politicas.html"
         class="px-4 sm:px-5 py-3 lg:py-0 lg:h-full
                text-[11px] md:text-xs font-bold
                text-white/90 hover:text-white
                lg:hover:bg-white/10
                uppercase tracking-widest
                flex items-center justify-start lg:justify-center
                border-b border-red-600 lg:border-none
                transition-colors">
        Políticas
      </a>

      <a href="alertas-qhse.html"
         class="px-4 sm:px-5 py-3 lg:py-0 lg:h-full
                text-[11px] md:text-xs font-bold
                text-white/90 hover:text-white
                lg:hover:bg-white/10
                uppercase tracking-widest
                flex items-center justify-start lg:justify-center
                border-b border-red-600 lg:border-none
                transition-colors">
        Alertas QHSE
      </a>

      <a href="javascript:void(0)"
         class="px-4 sm:px-5 py-3 lg:py-0 lg:h-full
                text-[11px] md:text-xs font-bold
                text-white/90 hover:text-white
                lg:hover:bg-white/10
                uppercase tracking-widest
                flex items-center justify-start lg:justify-center
                border-b border-red-600 lg:border-none
                transition-colors">
        Mantenimiento
      </a>

      <!-- Dropdown Completions -->
      <div class="relative dropdown lg:h-full flex flex-col lg:flex-row lg:items-center w-full lg:w-auto">

        <button onclick="toggleSubmenu(this); event.stopPropagation();"
                class="w-full lg:w-auto px-4 sm:px-5 py-3 lg:py-0 lg:h-full
                       text-[11px] md:text-xs font-bold
                       text-white/90 hover:text-white
                       lg:hover:bg-white/10
                       transition-all uppercase tracking-widest
                       flex items-center justify-between lg:justify-center gap-2">
          Completions
          <i class="fas fa-chevron-down text-[9px] opacity-70 transition-transform duration-200"></i>
        </button>

        <!-- Dropdown panel -->
        <div class="dropdown-menu hidden
                    w-full lg:absolute lg:top-full lg:left-0 lg:w-56 xl:w-64
                    bg-white lg:shadow-2xl z-[80]
                    lg:rounded-b-xl lg:border lg:border-slate-100
                    py-2 lg:py-3 mt-0 shadow-lg border-t-2 border-white/20 lg:border-none">

          <!-- Sub-item con sub-menú: Servicios -->
          <div class="relative group/sub">
            <button onclick="toggleSubmenu(this)"
                    class="flex items-center justify-between w-full
                           px-4 sm:px-5 py-2.5 sm:py-3
                           text-xs sm:text-sm text-slate-600
                           hover:bg-red-50 hover:text-[#e31e24]
                           transition-colors font-medium">
              <span class="flex items-center gap-3">
                <i class="fa-brands fa-whmcs w-4 sm:w-5 text-sm"></i> Tracking In Hole
              </span>
              <i class="fas fa-chevron-right text-[10px]"></i>
            </button>

            <!-- Sub-menú de Servicios -->
            <div class="submenu-content hidden
                        lg:absolute lg:left-full lg:top-0
                        w-full lg:w-56 xl:w-64
                        bg-slate-50 lg:bg-white z-[90]
                        lg:shadow-2xl lg:border lg:border-slate-100
                        py-2 lg:py-3 lg:rounded-r-xl">
              <a href="cementing.html"
                 class="block px-10 lg:px-5 py-2.5 text-xs
                        text-slate-500 hover:bg-slate-100 hover:text-[#e31e24]
                        border-b border-slate-100
                        transition-colors">
                Completions
              </a>
            </div>
          </div>


          <a href="#"
             class="flex items-center gap-3
                    px-4 sm:px-5 py-2.5 sm:py-3
                    text-xs sm:text-sm text-slate-600
                    hover:bg-red-50 hover:text-[#e31e24]
                    transition-colors font-medium">
            <i class="fas fa-toolbox w-4 sm:w-5 text-sm"></i> Suministros
          </a>
        </div>
      </div><!-- /dropdown -->

    </div>
  </div>
</nav>

<!--
  ╔══════════════════════════════════════════════════════╗
  ║  JS: asegúrate de tener estas funciones en tu app   ║
  ╚══════════════════════════════════════════════════════╝

  toggleMenu(id) — muestra/oculta el nav en móvil
  Reemplaza "hidden" por "block" (o usa classList.toggle):

  function toggleMenu(id) {
    const el = document.getElementById(id);
    el.classList.toggle('hidden');
    el.classList.toggle('block');
  }

  toggleSubmenu(btn) — abre/cierra dropdowns
  function toggleSubmenu(btn) {
    const menu = btn.nextElementSibling;
    menu.classList.toggle('hidden');
    const icon = btn.querySelector('.fa-chevron-down, .fa-chevron-right');
    if (icon) icon.classList.toggle('rotate-180');

    // Evita que el click se propague al botón padre (Completions)
    event.stopPropagation();
  }

  En lg+ el nav siempre es visible. Puedes forzarlo así en resize:
  window.addEventListener('resize', () => {
    if (window.innerWidth >= 1024) {
      document.getElementById('mobile-nav').classList.remove('hidden');
      document.getElementById('mobile-nav').classList.add('block');
    }
  });
-->
