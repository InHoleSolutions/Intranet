<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertas QHSE | In Hole Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: 'Barlow', sans-serif;
    }
    /* Gradientes complejos */
    .qhse-topbar {
      background: linear-gradient(135deg, #0a1628 0%, #0e2044 60%, #1a3160 100%);
    }
    .cover-page {
      background: linear-gradient(135deg, #0a1628 0%, #0e2044 50%, #1a3160 100%);
    }
    .cover-grid-bg {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(30, 136, 229, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(30, 136, 229, .07) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .cover-accent-line {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: linear-gradient(180deg, #00c8ff, #1e88e5, #e31e24);
    }
    .guardian-card {
      background: linear-gradient(135deg, #0a1628 0%, #1a3160 100%);
    }
    .guardian-avatar {
      background: linear-gradient(135deg, #00c8ff, #1e88e5);
    }
    #admin-panel {
      background: linear-gradient(135deg, #0a1628 0%, #1a3160 100%);
      border: 1px solid rgba(30, 136, 229, .3);
    }
    .tech-divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, #00c8ff, transparent);
      margin: 32px 0;
      opacity: .4;
    }
    .indice-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0e2044;
      color: #00c8ff;
      border: 1px solid rgba(0,200,255,.3);
      border-radius: 100px;
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      cursor: pointer;
      transition: all .2s;
    }
    .indice-btn:hover {
      background: #1e88e5;
      color: white;
    }
    /* ── HEMEROTECA (carrusel de ediciones anteriores) ── */
    #hemeroteca-wrap {
      max-width: 80%;
      margin: 0 auto 24px;
      padding: 0 16px;
    }
    /* ── MAPA DE CALOR: reportes por locación ── */
    #heatmap-locacion-wrap {
      max-width: 80%;
      margin: 0 auto 24px;
      padding: 0 16px;
    }
    .heatmap-fila {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .heatmap-fila:last-child { margin-bottom: 0; }
    .heatmap-label {
      width: 170px;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
      color: #0e2044;
    }
    .heatmap-barra-bg {
      flex: 1;
      height: 22px;
      background: #f1f5f9;
      border-radius: 6px;
      overflow: hidden;
    }
    .heatmap-barra-fill {
      height: 100%;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      transition: width .6s ease;
    }
    .heatmap-count {
      font-size: 11px;
      font-weight: 800;
      color: white;
    }
    .hemeroteca-titulo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      color: #0e2044;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .hemeroteca-titulo-texto {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hemeroteca-toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0e2044;
      color: #00c8ff;
      border: 1px solid rgba(0,200,255,.3);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      cursor: pointer;
      transition: all .2s;
    }
    .hemeroteca-toggle-btn:hover {
      background: #1e88e5;
      color: white;
    }
    #hemeroteca-wrap.colapsada .hemeroteca-scroller {
      display: none;
    }
    .hemeroteca-scroller { position: relative; }
    .hemeroteca-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      scroll-snap-type: x proximity;
      padding: 6px 4px 14px;
      scrollbar-width: none;
    }
    .hemeroteca-track::-webkit-scrollbar { display: none; }
    .hemeroteca-card {
      flex: 0 0 auto;
      width: 150px;
      height: 200px;
      border-radius: 12px;
      cursor: pointer;
      scroll-snap-align: start;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #0a1628 0%, #0e2044 60%, #1a3160 100%);
      border: 2px solid transparent;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px 10px;
    }
    .hemeroteca-card:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 10px 26px rgba(10,22,40,.35);
    }
    .hemeroteca-card.seleccionada {
      border-color: #00c8ff;
      box-shadow: 0 0 0 3px rgba(0,200,255,.25);
    }
    .hemeroteca-card.is-active::after {
      content: 'ACTUAL';
      position: absolute;
      top: 8px;
      right: 8px;
      background: #e31e24;
      color: white;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .06em;
      padding: 3px 7px;
      border-radius: 100px;
    }
    .hemeroteca-mini-edicion {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #00c8ff;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .hemeroteca-mini-titulo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 17px;
      font-weight: 900;
      font-style: italic;
      line-height: 1.05;
      color: white;
      margin: 4px 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hemeroteca-mini-vol {
      font-size: 10px;
      color: rgba(255,255,255,.55);
      font-weight: 600;
    }
    .hemeroteca-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(10,22,40,.85);
      color: #00c8ff;
      border: 1px solid rgba(0,200,255,.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      transition: all .2s;
    }
    .hemeroteca-arrow:hover { background: #1e88e5; color: white; }
    .hemeroteca-arrow.left { left: -6px; }
    .hemeroteca-arrow.right { right: -6px; }
    @media (max-width: 640px) {
      #hemeroteca-wrap { max-width: 100%; }
      .hemeroteca-arrow { display: none; }
      .hemeroteca-card { width: 120px; height: 168px; }
      .hemeroteca-mini-titulo { font-size: 14px; }
    }
    /* Tipografía con clamp */
    .cover-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(52px, 10vw, 110px);
      font-weight: 900;
      font-style: italic;
      line-height: .9;
      letter-spacing: -.02em;
      color: white;
    }
    .cover-subtitle {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(18px, 4vw, 32px);
      font-weight: 600;
      font-style: italic;
      color: #00c8ff;
      letter-spacing: .08em;
    }
    .section-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 100px;
    }
    .nm-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #e31e24;
    }
    .stat-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
    }
    .page-number {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 120px;
      font-weight: 900;
      font-style: italic;
      color: rgba(10, 22, 40, .04);
      position: absolute;
      top: -20px;
      right: 16px;
      line-height: 1;
      user-select: none;
      pointer-events: none;
    }
    /* Componentes que usan clases CSS propias */
    .section-card {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(10, 22, 40, .08);
      background: white;
      margin-bottom: 32px;
    }
    .section-header {
      padding: 20px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .qr-box {
      background: #0a1628;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .qr-canvas-wrap {
      background: white;
      border-radius: 10px;
      padding: 8px;
      flex-shrink: 0;
    }
    .qr-info {
      flex: 1;
      min-width: 180px;
    }
    .nm-card {
      border-left: 5px solid #e31e24;
      background: #fff5f5;
      border-radius: 0 14px 14px 0;
      padding: 20px 22px;
      margin: 16px 0;
    }
    .stat-pill {
      background: #f0f4f8;
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .epp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 16px;
      padding: 20px;
    }
    .epp-item {
      background: #f0f4f8;
      border-radius: 14px;
      padding: 16px 10px;
      text-align: center;
      border: 2px solid transparent;
      transition: all .25s;
      cursor: default;
    }
    .epp-item:hover {
      border-color: #1e88e5;
      background: #e8f4fd;
      transform: translateY(-3px);
    }
    .epp-icon {
      font-size: 32px;
      margin-bottom: 8px;
      display: block;
    }
    .epp-label {
      font-size: 11px;
      font-weight: 700;
      color: #0e2044;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .responsive-table {
      overflow-x: auto;
    }
    .responsive-table table {
      min-width: 600px;
    }
    /* Admin */
    .admin-tab {
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all .2s;
      background: rgba(255, 255, 255, .08);
      color: rgba(255, 255, 255, .7);
      border: 1px solid transparent;
    }
    .admin-tab.active,
    .admin-tab:hover {
      background: #1e88e5;
      color: white;
      border-color: #00c8ff;
    }
    .admin-input {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 10px;
      padding: 10px 14px;
      color: white;
      font-size: 14px;
      width: 100%;
      outline: none;
      font-family: 'Barlow', sans-serif;
    }
    .admin-input:focus {
      border-color: #00c8ff;
    }
    .admin-input option {
      color: #1a1a1a;
    }
    .admin-btn {
      padding: 10px 22px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all .2s;
      border: none;
      font-family: 'Barlow', sans-serif;
    }
    .admin-btn-primary {
      background: #1e88e5;
      color: white;
    }
    .admin-btn-primary:hover {
      background: #00c8ff;
      color: #0a1628;
    }
    .admin-btn-danger {
      background: rgba(227, 30, 36, .2);
      color: #ff6b6b;
      border: 1px solid rgba(227, 30, 36, .3);
    }
    .admin-btn-danger:hover {
      background: #e31e24;
      color: white;
    }
    .admin-btn-success {
      background: rgba(16, 185, 129, .2);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, .3);
    }
    .admin-btn-success:hover {
      background: #10b981;
      color: white;
    }
    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0a1628;
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .4);
      border-left: 4px solid #00c8ff;
      transform: translateY(100px);
      opacity: 0;
      transition: all .4s cubic-bezier(.175, .885, .32, 1.275);
      z-index: 9999;
      max-width: 320px;
    }
    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(10, 22, 40, .85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: #0e2044;
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      color: white;
      border: 1px solid rgba(30, 136, 229, .3);
      max-height: 90vh;
      overflow-y: auto;
    }
    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f8fafc 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
      height: 20px;
    }
    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    @media (max-width: 640px) {
      body {
        overflow-x: hidden;
      }
      main {
        padding-left: 12px !important;
        padding-right: 12px !important;
      }
      .section-card {
        overflow-x: hidden;
        margin-bottom: 16px;
      }
      .section-header {
        flex-wrap: wrap;
        gap: 8px;
        padding: 14px 16px;
      }
      .section-header .ml-auto {
        display: none;
      }
      .page-number {
        display: none;
      }
      .cover-page {
        min-height: auto !important;
      }
      .cover-title {
        font-size: clamp(44px, 15vw, 80px) !important;
      }
      .epp-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 12px;
      }
      .qr-box {
        flex-direction: column;
        text-align: center;
      }
      .qr-info {
        min-width: unset;
      }
      .nm-card {
        padding: 14px 16px;
      }
      .guardian-card {
        padding: 20px !important;
      }
      .stat-num {
        font-size: 28px;
      }
      .stat-pill {
        padding: 10px 12px;
      }
      #admin-panel {
        padding: 20px 16px;
        border-radius: 16px;
      }
      #admin-panel .flex.flex-wrap {
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 8px;
        -webkit-overflow-scrolling: touch;
      }
      .admin-tab {
        white-space: nowrap;
        flex-shrink: 0;
        padding: 8px 14px;
        font-size: 12px;
      }
      .qhse-topbar {
        flex-wrap: nowrap;
        overflow: hidden;
        padding: 10px 14px;
        gap: 6px;
      }
    }
    @media (max-width: 480px) {
      .cover-title {
        font-size: clamp(38px, 13vw, 60px) !important;
      }
    }
    #site-header { display: block; }
    .mobile-active { display: block !important; }

    /* ── MODO LECTURA / PANTALLA COMPLETA ── */
    body.modo-lectura #site-header,
    body.modo-lectura #topbar,
    body.modo-lectura #footer-componente { display: none !important; }
    body.modo-lectura main {
      margin-top: 0 !important;
      padding: 0 !important;
      max-width: 100% !important;
    }
    body.modo-lectura #revista-container {
      min-height: 100vh !important;
      padding: 24px !important;
    }
    #btn-salir-lectura {
      position: fixed; top: 16px; right: 16px; z-index: 9999;
      background: rgba(10,22,40,.85); color: #00c8ff; border: 1px solid rgba(0,200,255,.4);
      padding: 10px 18px; border-radius: 100px; font-size: 13px; font-weight: 700;
      cursor: pointer; backdrop-filter: blur(6px); transition: all .2s;
    }
    #btn-salir-lectura:hover { background: #1e88e5; color: white; }
    body.cursor-oculto,
    body.cursor-oculto * { cursor: none !important; }

    #indicador-auto {
      position: fixed; bottom: 20px; left: 20px; z-index: 9999;
      background: rgba(10,22,40,.75); color: rgba(255,255,255,.85);
      padding: 8px 16px; border-radius: 100px; font-size: 12px; font-weight: 600;
      letter-spacing: .04em; display: flex; align-items: center; gap: 8px;
      backdrop-filter: blur(6px); transition: opacity .3s;
    }
    .indicador-auto-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #00c8ff;
      animation: pulso-indicador 1.6s ease-in-out infinite;
    }
    @keyframes pulso-indicador {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,200,255,.5); }
      50%      { opacity: .6; box-shadow: 0 0 0 6px rgba(0,200,255,0); }
    }
    /* ── ODÓMETRO: contador animado de "días sin accidente" ── */
    @keyframes odometroDestello {
      0%   { text-shadow: 0 0 0 rgba(52,211,153,0); }
      40%  { text-shadow: 0 0 16px rgba(52,211,153,.9); }
      100% { text-shadow: 0 0 0 rgba(52,211,153,0); }
    }
    .odometro-final {
      animation: odometroDestello .6s ease-out;
    }
    body.cursor-oculto #indicador-auto { opacity: .5; }
  </style>
  <script src="revista-render.js"></script>
  <script src="revista-mobile.js"></script>
</head>

<body>
  <!-- ── HEADER ── -->
  <div id="site-header"></div>
  <!-- ── TOPBAR ── -->
  <div class="qhse-topbar fixed top-[56px] sm:top-[64px] lg:top-[112px] xl:top-[118px] 3xl:top-[134px] w-full z-50"
    id="topbar">
    <div class="max-w-[1440px] mx-auto px-4 md:px-8 flex items-center justify-between"
      style="flex-wrap:nowrap;overflow:hidden;">
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-[#00c8ff] animate-pulse"></span>
          <span
            style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.9)">SENTINEL
            IHS</span>
        </div>
        <div class="h-4 w-px bg-white/20"></div>
        <span id="edition-tag" style="font-size:12px;color:rgba(255,255,255,.6);font-weight:500">Cargando
          edición...</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="issue-counter" style="font-family:'DM Mono',monospace;font-size:12px;color:rgba(0,200,255,.8)">— —
          —</span>
        <a href="admin-qhse.html" id="btn-admin-toggle"
          class="hidden px-4 py-2 rounded-lg text-[12px] font-bold uppercase tracking-wider border border-[#1e88e5]/40 text-[#00c8ff] hover:bg-[#1e88e5]/20 transition-all inline-block no-underline">
          <i class="fas fa-sliders mr-1.5"></i>Panel Admin
      </a>
      <button onclick="toggleModoLectura()" title="Modo lectura / Pantalla completa"
          class="px-4 py-2 rounded-lg text-[12px] font-bold uppercase tracking-wider border border-[#1e88e5]/40 text-[#00c8ff] hover:bg-[#1e88e5]/20 transition-all">
          <i class="fas fa-expand mr-1.5"></i>Pantalla Completa
      </button>
      </div>
    </div>
  </div>
  <!-- ── MAIN ── -->
  <main class="mx-auto px-0 py-4 mt-[96px] sm:mt-[104px] lg:mt-[152px] xl:mt-[158px] 3xl:mt-[174px]"
    style="max-width:100%;">
    <div class="flex items-center gap-3 mb-1 px-4 md:px-56">
      <a href="dashboard.html" class="text-slate-400 hover:text-[#e31e24] text-sm transition-colors"><i
          class="fas fa-home"></i></a>
      <span class="text-slate-300">/</span>
      <span class="text-sm text-slate-500 font-medium">Alertas QHSE</span>
    </div>

    <div id="hemeroteca-wrap">
      <div class="hemeroteca-titulo">

    async function cargarHeatmapLocacion() {
      const cont = document.getElementById('heatmap-locacion-body');
      if (!cont) return;

      const anioActual = new Date().getFullYear();
      const { data: reportes, error } = await sb
        .from('safety_alerts')
        .select('locacion')
        .eq('anio_registro', anioActual);

      if (error || !reportes || reportes.length === 0) {
        cont.innerHTML = '<p style="text-align:center;color:#94a3b8;font-size:12px;">Aún no hay reportes registrados este año.</p>';
        return;
      }

      const conteos = CATEGORIAS_LOCACION.map(cat => ({
        ...cat,
        total: reportes.filter(r => (r.locacion || '').startsWith(cat.prefijo)).length,
      }));

      const maxTotal = Math.max(...conteos.map(c => c.total), 1);

      cont.innerHTML = conteos
        .sort((a, b) => b.total - a.total)
        .map(c => {
          const pct = Math.round((c.total / maxTotal) * 100);
          // Más reportes = rojo más intenso (heat map real)
          const intensidad = c.total === 0 ? 0 : 0.25 + (c.total / maxTotal) * 0.65;
          const color = c.total === 0 ? '#cbd5e1' : `rgba(227, 30, 36, ${intensidad})`;
          return `
            <div class="heatmap-fila">
              <div class="heatmap-label">${c.nombre}</div>
              <div class="heatmap-barra-bg">
                <div class="heatmap-barra-fill" style="width:${Math.max(pct, c.total > 0 ? 8 : 0)}%; background:${color};">
                  ${c.total > 0 ? `<span class="heatmap-count">${c.total}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');
    }

      // Marcar en el carrusel cuál edición se está viendo ahora mismo

    // ── HEMEROTECA: carga las miniaturas de todas las ediciones publicadas ──

    function aplicarPreferenciaHemeroteca() {

    // ── ODÓMETRO: anima un número de 0 hasta valorFinal ──
    function animarContador(elId, valorFinal, duracionMs = 1400) {
      const el = document.getElementById(elId);
      if (!el) return;
      const destino = Number(valorFinal) || 0;

      if (destino <= 0) { el.textContent = 0; return; }

      const inicio = performance.now();
      // easeOutExpo: arranca rápido y "asienta" al final, como un odómetro real
      const easeOutExpo = t => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t));

      function frame(ahora) {
        const t = Math.min((ahora - inicio) / duracionMs, 1);
        const valorActual = Math.round(easeOutExpo(t) * destino);
        el.textContent = valorActual;

        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          el.textContent = destino;
          el.classList.remove('odometro-final');
          void el.offsetWidth; // reinicia la animación CSS si se repite
          el.classList.add('odometro-final');
        }
      }
      requestAnimationFrame(frame);
    }

    // ── SPARKLINE: resta N meses a un mes/año dado ──
    function restarMeses(mes, anio, n) {
      let m = mes - n;
      let a = anio;
      while (m <= 0) { m += 12; a -= 1; }
      return { mes: m, anio: a };
    }

    // ── SPARKLINE: dibuja la mini gráfica de tendencia ──
    function renderSparkline(valores) {
      const svg = document.getElementById('pv-sparkline-svg');
      const trendEl = document.getElementById('pv-sparkline-trend');
      if (!svg || !valores || valores.length === 0) return;

      const w = 200, h = 40, pad = 4;
      const max = Math.max(...valores, 1);
      const min = Math.min(...valores, 0);
      const rango = (max - min) || 1;

      const puntos = valores.map((v, i) => {
        const x = pad + (i * (w - pad * 2)) / (valores.length - 1 || 1);
        const y = h - pad - ((v - min) / rango) * (h - pad * 2);
        return [x, y];
      });

      const linea = puntos.map(p => p.join(',')).join(' ');
      const area = `${pad},${h - pad} ${linea} ${w - pad},${h - pad}`;

      // "Mejora" = terminamos con menos (o igual) reportes que al inicio
      const mejora = valores[valores.length - 1] <= valores[0];
      const color = mejora ? '#34d399' : '#fbbf24';

      svg.innerHTML = `
        <defs>
          <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <polygon points="${area}" fill="url(#sparkGrad)"/>
        <polyline points="${linea}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${puntos[puntos.length - 1][0]}" cy="${puntos[puntos.length - 1][1]}" r="3" fill="${color}"/>
      `;

      const diferencia = valores[0] === 0
        ? 0
        : Math.round(((valores[valores.length - 1] - valores[0]) / valores[0]) * 100);

      if (trendEl) {
        trendEl.style.color = color;
        trendEl.innerHTML = mejora
          ? `<i class="fas fa-arrow-down"></i> ${Math.abs(diferencia)}%`
          : `<i class="fas fa-arrow-up"></i> ${Math.abs(diferencia)}%`;
      }
    }

    async function cargarStatsAutomaticos(mesRevista, anioRevista) {
      const mes = mesRevista ?? new Date().getMonth() + 1;
      const anio = anioRevista ?? new Date().getFullYear();

      // 1. REPORTES DE RIESGO — todos los registros del mes/año
      const { count: totalReportes } = await sb
        .from('safety_alerts')
        .select('id', { count: 'exact', head: true })
        .eq('mes_registro', mes)
        .eq('anio_registro', anio);

      // 2. NEAR MISS RESUELTOS — solo los de tipo "Incidente" del mes/año
      const { count: totalNearMiss } = await sb
        .from('safety_alerts')
        .select('id', { count: 'exact', head: true })
        .eq('mes_registro', mes)
        .eq('anio_registro', anio)
        .eq('tipo_evento', 'Incidente');

      // 3. DÍAS SIN ACCIDENTE — días desde el último accidente registrado
      const { data: ultimoAccidenteArr } = await sb
        .from('safety_alerts')
        .select('fecha_evento')
        .eq('tipo_evento', 'Accidente')
        .order('fecha_evento', { ascending: false })
        .limit(1);
      const ultimoAccidente = ultimoAccidenteArr?.[0] ?? null;

      let diasSinAccidente = 0;
      if (ultimoAccidente?.fecha_evento) {
        const hoy = new Date();
        const fechaAcc = new Date(ultimoAccidente.fecha_evento);
        const diffMs = hoy - fechaAcc;
        diasSinAccidente = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      } else {
        // Sin accidentes registrados, contar desde inicio del año
        diasSinAccidente = Math.floor((new Date() - new Date(anio, 0, 1)) / (1000 * 60 * 60 * 24));
      }

      // 4. Pintar en la revista
      const setEl = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.textContent = val ?? 0;
      };
      animarContador('pv-stat-dias', diasSinAccidente);
      animarContador('pv-stat-obs', totalReportes ?? 0);
      animarContador('pv-stat-acc', totalNearMiss ?? 0);

      // 5. TENDENCIA — reportes de riesgo de los últimos 6 meses (incluyendo el mes de la edición)
      const ultimosSeisMeses = [5, 4, 3, 2, 1, 0].map(n => restarMeses(mes, anio, n));
      const conteosSparkline = await Promise.all(
        ultimosSeisMeses.map(({ mes: m, anio: a }) =>
          sb.from('safety_alerts')
            .select('id', { count: 'exact', head: true })
            .eq('mes_registro', m)
            .eq('anio_registro', a)
        )
      );
      renderSparkline(conteosSparkline.map(c => c.count ?? 0));
    }

    // ── ÍNDICE INTERACTIVO ──
    const MAPA_INDICE = {
      safety:      { hoja: 2,  seccion: 'prev-safety'      },

      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    let toastTimer = null;
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      const colors = { success: '#00c8ff', error: '#ef4444', warn: '#f59e0b' };
      toast.style.borderLeftColor = colors[type] || colors.success;
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3800);
    }

    init();
  </script>

  <script>
    // Los <script> insertados vía innerHTML NO se ejecutan solos.
    // Esta función los "recrea" para que sí corran.
    function ejecutarScriptsInyectados(contenedor) {
      contenedor.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
      });
    }

    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        const contenedor = document.getElementById('site-header');
        contenedor.innerHTML = html;
        ejecutarScriptsInyectados(contenedor);
      });
    fetch('footer.html')
      .then(r => r.text())
      .then(html => {
        const contenedorFooter = document.getElementById('footer-componente');
        contenedorFooter.innerHTML = html;
        ejecutarScriptsInyectados(contenedorFooter);
        document.getElementById('footer-year').textContent = new Date().getFullYear();
      });
    function toggleMenu(id) { 
      document.getElementById(id).classList.toggle('hidden'); 
    }

    // ── MODO LECTURA / PANTALLA COMPLETA ──
    let autoAvanceInterval = null;

    function toggleModoLectura() {
      const activo = document.body.classList.toggle('modo-lectura');
      document.getElementById('btn-salir-lectura').classList.toggle('hidden', !activo);

      if (activo) {
        document.documentElement.requestFullscreen?.().catch(() => {});
        iniciarAutoAvance();
        iniciarOcultarCursor();
      } else if (document.fullscreenElement) {
        document.exitFullscreen?.();
      }

      if (!activo) {
        detenerAutoAvance();
        detenerOcultarCursor();
      }
    }

    // ── AUTO-AVANCE (flip automático o auto-scroll) ──
    function iniciarAutoAvance() {
      detenerAutoAvance();
      document.getElementById('indicador-auto').classList.remove('hidden');
      autoAvanceInterval = setInterval(() => {
        const bookOverlay = document.getElementById('book-overlay');

        if (bookOverlay) {
          // Modo flipbook (celular/tablet): usa voltearPagina y regresa al inicio al llegar al final
          const btnNext = document.getElementById('btn-next');
          if (btnNext && !btnNext.disabled) {
            voltearPagina(1);
          } else {
            // Llegó al final: reinicia desde la primera página
            hojaActual = 0;
            renderizarHoja(0);
          }
        } else {
          // Modo escritorio (sin paginación): auto-scroll suave
          const cerca_del_final = (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 40);
          if (cerca_del_final) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            window.scrollBy({ top: window.innerHeight * 0.85, behavior: 'smooth' });
          }
        }
      }, 8000); // cada 8 segundos — ajustable
    }

    function detenerAutoAvance() {
      if (autoAvanceInterval) { clearInterval(autoAvanceInterval); autoAvanceInterval = null; }
      document.getElementById('indicador-auto').classList.add('hidden');
    }

    // ── OCULTAR CURSOR EN INACTIVIDAD ──
    let cursorTimeout = null;
    function resetCursor() {
      document.body.classList.remove('cursor-oculto');
      clearTimeout(cursorTimeout);
      cursorTimeout = setTimeout(() => {
        if (document.body.classList.contains('modo-lectura')) {
          document.body.classList.add('cursor-oculto');
        }
      }, 3000); // 3 segundos sin mover el mouse
    }

    function iniciarOcultarCursor() {
      document.addEventListener('mousemove', resetCursor);
      resetCursor();
    }

    function detenerOcultarCursor() {
      document.removeEventListener('mousemove', resetCursor);
      clearTimeout(cursorTimeout);
      document.body.classList.remove('cursor-oculto');
    }

    // Si el usuario sale de pantalla completa con ESC o el botón nativo del navegador,
    // también salimos del modo lectura para no dejarlo "atrapado" sin header.
    document.getElementById('revista-container').addEventListener('dblclick', toggleModoLectura);

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && document.body.classList.contains('modo-lectura')) {
        document.body.classList.remove('modo-lectura');
        document.getElementById('btn-salir-lectura').classList.add('hidden');
        detenerAutoAvance();
        detenerOcultarCursor();
      }
    });

    function toggleSubmenu(btn) {
      const submenu = btn.nextElementSibling;
      if (!submenu) return;
      if (window.innerWidth < 1024) {
        submenu.classList.toggle('mobile-active');
      } else {
        submenu.classList.toggle('hidden');
      }
      const icon = btn.querySelector('.fa-chevron-down, .fa-chevron-right');
      if (icon) icon.classList.toggle('rotate-180');
    }
    function cerrarSesion() {
      sb.auth.signOut().then(() => {
        window.location.href = '../index.html';
      });
    }
  </script>

  <div id="footer-componente"></div>

</body>
</html>
