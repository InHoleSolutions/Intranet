<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertas QHSE | In Hole Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    body { font-family: 'Barlow', sans-serif; }

    /* Gradientes complejos */
    .qhse-topbar { background: linear-gradient(135deg, #0a1628 0%, #0e2044 60%, #1a3160 100%); }
    .cover-page  { background: linear-gradient(135deg, #0a1628 0%, #0e2044 50%, #1a3160 100%); }
    .cover-grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(30,136,229,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(30,136,229,.07) 1px, transparent 1px); background-size: 40px 40px; }
    .cover-accent-line { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: linear-gradient(180deg, #00c8ff, #1e88e5, #e31e24); }
    .guardian-card { background: linear-gradient(135deg, #0a1628 0%, #1a3160 100%); }
    .guardian-avatar { background: linear-gradient(135deg, #00c8ff, #1e88e5); }
    #admin-panel { background: linear-gradient(135deg, #0a1628 0%, #1a3160 100%); border: 1px solid rgba(30,136,229,.3); }
    .tech-divider { height: 2px; background: linear-gradient(90deg, transparent, #00c8ff, transparent); margin: 32px 0; opacity: .4; }

    /* Tipografía con clamp */
    .cover-title    { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(52px, 10vw, 110px); font-weight: 900; font-style: italic; line-height: .9; letter-spacing: -.02em; color: white; }
    .cover-subtitle { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(18px, 4vw, 32px); font-weight: 600; font-style: italic; color: #00c8ff; letter-spacing: .08em; }
    .section-badge  { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding: 4px 12px; border-radius: 100px; }
    .nm-label       { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #e31e24; }
    .stat-num       { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 900; line-height: 1; }
    .page-number    { font-family: 'Barlow Condensed', sans-serif; font-size: 120px; font-weight: 900; font-style: italic; color: rgba(10,22,40,.04); position: absolute; top: -20px; right: 16px; line-height: 1; user-select: none; pointer-events: none; }

    /* Componentes que usan clases CSS propias */
    .section-card  { border-radius: 20px; overflow: hidden; box-shadow: 0 4px 24px rgba(10,22,40,.08); background: white; margin-bottom: 32px; }
    .section-header { padding: 20px 28px; display: flex; align-items: center; gap: 14px; }
    .qr-box { background: #0a1628; border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .qr-canvas-wrap { background: white; border-radius: 10px; padding: 8px; flex-shrink: 0; }
    .qr-info { flex: 1; min-width: 180px; }
    .nm-card { border-left: 5px solid #e31e24; background: #fff5f5; border-radius: 0 14px 14px 0; padding: 20px 22px; margin: 16px 0; }
    .stat-pill { background: #f0f4f8; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
    .epp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 16px; padding: 20px; }
    .epp-item { background: #f0f4f8; border-radius: 14px; padding: 16px 10px; text-align: center; border: 2px solid transparent; transition: all .25s; cursor: default; }
    .epp-item:hover { border-color: #1e88e5; background: #e8f4fd; transform: translateY(-3px); }
    .epp-icon  { font-size: 32px; margin-bottom: 8px; display: block; }
    .epp-label { font-size: 11px; font-weight: 700; color: #0e2044; text-transform: uppercase; letter-spacing: .04em; }
    .responsive-table { overflow-x: auto; }
    .responsive-table table { min-width: 600px; }

    /* Admin */
    .admin-tab { padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; transition: all .2s; background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); border: 1px solid transparent; }
    .admin-tab.active, .admin-tab:hover { background: #1e88e5; color: white; border-color: #00c8ff; }
    .admin-input { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: 10px 14px; color: white; font-size: 14px; width: 100%; outline: none; font-family: 'Barlow', sans-serif; }
    .admin-input:focus { border-color: #00c8ff; }
    .admin-input option { color: #1a1a1a; }
    .admin-btn { padding: 10px 22px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; transition: all .2s; border: none; font-family: 'Barlow', sans-serif; }
    .admin-btn-primary { background: #1e88e5; color: white; }
    .admin-btn-primary:hover { background: #00c8ff; color: #0a1628; }
    .admin-btn-danger  { background: rgba(227,30,36,.2); color: #ff6b6b; border: 1px solid rgba(227,30,36,.3); }
    .admin-btn-danger:hover { background: #e31e24; color: white; }
    .admin-btn-success { background: rgba(16,185,129,.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); }
    .admin-btn-success:hover { background: #10b981; color: white; }

    /* Toast */
    #toast { position: fixed; bottom: 24px; right: 24px; background: #0a1628; color: white; padding: 14px 22px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 40px rgba(0,0,0,.4); border-left: 4px solid #00c8ff; transform: translateY(100px); opacity: 0; transition: all .4s cubic-bezier(.175,.885,.32,1.275); z-index: 9999; max-width: 320px; }
    #toast.show { transform: translateY(0); opacity: 1; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(10,22,40,.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #0e2044; border-radius: 20px; padding: 32px; width: 100%; max-width: 560px; color: white; border: 1px solid rgba(30,136,229,.3); max-height: 90vh; overflow-y: auto; }

    /* Skeleton */
    .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f8fafc 50%, #e2e8f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; height: 20px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    @media (max-width: 640px) {
      body { overflow-x: hidden; }
      main { padding-left: 12px !important; padding-right: 12px !important; }
      .section-card { overflow-x: hidden; margin-bottom: 16px; }
      .section-header { flex-wrap: wrap; gap: 8px; padding: 14px 16px; }
      .section-header .ml-auto { display: none; }
      .page-number { display: none; }
      .cover-page { min-height: auto !important; }
      .cover-title { font-size: clamp(44px, 15vw, 80px) !important; }
      .epp-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
      .qr-box { flex-direction: column; text-align: center; }
      .qr-info { min-width: unset; }
      .nm-card { padding: 14px 16px; }
      .guardian-card { padding: 20px !important; }
      .stat-num { font-size: 28px; }
      .stat-pill { padding: 10px 12px; }
      #admin-panel { padding: 20px 16px; border-radius: 16px; }
      #admin-panel .flex.flex-wrap { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
      .admin-tab { white-space: nowrap; flex-shrink: 0; padding: 8px 14px; font-size: 12px; }
      .qhse-topbar { flex-wrap: nowrap; overflow: hidden; padding: 10px 14px; gap: 6px; }
    }
    @media (max-width: 480px) {
      .cover-title { font-size: clamp(38px, 13vw, 60px) !important; }
    }
  </style>
  <script src="revista-render.js"></script>
  <script src="revista-mobile.js"></script>
</head>
<body>

<!-- ── HEADER ── -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-[60] glass-nav">
  <div class="max-w-[1440px] mx-auto px-6 h-20 flex justify-between items-center">
    <div class="flex items-center gap-8 cursor-pointer" onclick="window.location.href='dashboard.html'">
      <img src="../assets/images/logo/logo-dark.svg" alt="In Hole Solutions" class="h-12 md:h-20 w-auto">
      <div class="hidden md:block h-8 w-[1px] bg-slate-200"></div>
      <span class="hidden md:block text-slate-500 font-medium text-sm tracking-wide uppercase">Intranet Corporativa</span>
    </div>
    <div class="flex items-center gap-6">
      <div class="text-right hidden sm:block">
        <p id="user-welcome" class="text-slate-800 font-semibold text-sm">Cargando...</p>
        <p class="text-slate-400 text-xs font-medium uppercase tracking-tighter">Miembro del Equipo</p>
      </div>
      <button onclick="window.location.href='dashboard.html'" class="bg-slate-50 hover:bg-slate-100 text-slate-400 hover:text-slate-700 h-10 w-10 rounded-xl border border-slate-200 transition-all flex items-center justify-center shadow-sm" title="Regresar al Dashboard">
        <i class="fas fa-arrow-left"></i>
      </button>
      <button onclick="cerrarSesion()" class="bg-slate-50 hover:bg-red-50 text-slate-400 hover:text-red-600 h-10 w-10 rounded-xl border border-slate-200 transition-all flex items-center justify-center shadow-sm">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </div>
</header>

<!-- ── TOPBAR ── -->
<div class="qhse-topbar sticky top-20 z-50">
  <div class="max-w-[1440px] mx-auto px-4 md:px-8 flex items-center justify-between" style="flex-wrap:nowrap;overflow:hidden;">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-[#00c8ff] animate-pulse"></span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.9)">SENTINEL IHS</span>
      </div>
      <div class="h-4 w-px bg-white/20"></div>
      <span id="edition-tag" style="font-size:12px;color:rgba(255,255,255,.6);font-weight:500">Cargando edición...</span>
    </div>
    <div class="flex items-center gap-3">
      <span id="issue-counter" style="font-family:'DM Mono',monospace;font-size:12px;color:rgba(0,200,255,.8)">— — —</span>
      <a href="admin-qhse.html" id="btn-admin-toggle"
          class="hidden px-4 py-2 rounded-lg text-[12px] font-bold uppercase tracking-wider border border-[#1e88e5]/40 text-[#00c8ff] hover:bg-[#1e88e5]/20 transition-all inline-block no-underline">
          <i class="fas fa-sliders mr-1.5"></i>Panel Admin
      </a>
    </div>
  </div>
</div>

<!-- ── MAIN ── -->
<main class="mx-auto px-0 py-4" style="max-width:100%; overflow-x:auto;">
  <div id="revista-container" style="padding: 8px 0; background: #e8edf4; min-height: 100vh; min-width: 1200px; overflow-x: auto;"></div>
</main>

<!-- ── TOAST ── -->
<div id="toast">✓ <span id="toast-msg">Guardado correctamente</span></div>

<!-- ── MODAL EDICIÓN NEAR MISS (historial) ── -->
<div id="modal-nm-view" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-white font-black text-xl" style="font-family:'Barlow Condensed',sans-serif;font-style:italic">Detalle Near Miss</h3>
      <button onclick="closeModal('modal-nm-view')" class="h-9 w-9 rounded-xl flex items-center justify-center text-white/50 hover:text-white transition-all" style="background:rgba(255,255,255,.06)">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div id="modal-nm-content" class="text-white/80 text-sm leading-relaxed"></div>
    <button onclick="closeModal('modal-nm-view')" class="admin-btn admin-btn-primary w-full mt-5">Cerrar</button>
  </div>
</div>

<!-- ── SCRIPTS ── -->
<script>
  const { createClient } = supabase;
  const sb = createClient(
    'https://bgqlvkvlscujikhzzazf.supabase.co',
    'sb_publishable_mzHMY11jZ7OaMES008LTzA_d7Ya1A2g'
  );

  let currentUser = null;
  let isAdmin = false;

  async function cerrarSesion() { await sb.auth.signOut(); window.location.href = '../index.html'; }

  // ── INIT ──
  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'intranet-login.html'; return; }
    currentUser = session.user;

    const { data: perfil } = await sb.from('perfiles').select('*').eq('id', session.user.id).single();
    if (perfil) {
      const saludo = getGreeting();
      document.getElementById('user-welcome').innerText = `${saludo}, ${perfil.nombre_completo}`;
      isAdmin = perfil.rol === 'admin' ||  perfil.rol === 'Administrador' || perfil.rol === 'administrador';
      if (isAdmin) {
        document.getElementById('btn-admin-toggle').classList.remove('hidden');
      }
    }

    await cargarRevista();
  }

  function getGreeting() {
    const h = new Date().getHours();
    if (h >= 6 && h < 12) return 'Buenos días';
    if (h >= 12 && h < 19) return 'Buenas tardes';
    return 'Buenas noches';
  }

  // ── LOAD LATEST EDITION FROM SUPABASE ──
  async function cargarRevista() {
    const { data, error } = await sb
      .from('qhse_editions')
      .select('*')
      .eq('publicada', true)
      .eq('activa', true)
      .order('created_at', { ascending: false })
      .limit(1)
      .single();

    if (error || !data) {
      document.getElementById('edition-tag').textContent = 'Edición Mayo 2026 — Vol.1';
      document.getElementById('issue-counter').textContent = 'ED-001';
      return;
    }

    applyEditionToPage(data);
  }

  // ── ADMIN: LOAD EDITIONS ──
  async function cargarRevista() {
    const { data, error } = await sb
      .from('qhse_editions')
      .select('*')
      .eq('publicada', true)
      .eq('activa', true)
      .order('created_at', { ascending: false })
      .limit(1)
      .single();

    if (error || !data) {
      document.getElementById('revista-container').innerHTML =
        '<p style="text-align:center;padding:60px;color:#64748b;font-size:14px;">No hay edición publicada actualmente.</p>';
      return;
    }

    montarRevista('revista-container');
    aplicarEdicionARevista(data);

    // Actualizar topbar
    const setEl = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.textContent = val; };
    setEl('edition-tag',  data.edicion ? `Edición ${data.edicion} — ${data.volumen || 'Vol.1'}` : 'Edición —');
    setEl('issue-counter', data.id ? `ED-${String(data.id).padStart(3,'0')}` : '— — —');

    // Cargar Near Miss de esta edición
    const { data: nm } = await sb
      .from('qhse_near_miss')
      .select('*')
      .eq('edition_id', data.id)
      .eq('visible_revista', true)
      .order('created_at', { ascending: false })
      .limit(1)
      .single();

    if (nm) {
      const pv = id => document.getElementById(id);
      const set = (id, val) => { const el = pv(id); if (el && val != null) el.textContent = val; };
      set('pv-nm-area',   (nm.area || '').toUpperCase());
      set('pv-nm-titulo', nm.titulo || '—');
      set('pv-nm-desc',   nm.descripcion || '');
      set('pv-nm-causa',  nm.causa_raiz || '—');
      set('pv-nm-accion', nm.accion_correctiva || '—');
    }
    // Actualizar también la portada estática superior
    const set = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.textContent = val; };
    if (data.titulo) { const ct = document.getElementById('cover-title'); if (ct) ct.textContent = data.titulo; }
    set('cover-edition-badge', data.edicion ? `Edición ${data.edicion}` : '');
    set('edition-tag',  data.edicion ? `Edición ${data.edicion} — ${data.volumen || 'Vol.1'}` : '');
    set('issue-counter', data.id ? `ED-${String(data.id).padStart(3,'0')}` : '');
    set('director-message', data.mensaje_director);
    set('director-name', data.nombre_director ? `Ing. ${data.nombre_director}` : '');
    set('stat-dias', data.stat_dias ?? 0);
    set('stat-obs',  data.stat_obs  ?? 0);
    set('stat-acc',  data.stat_acc  ?? 0);

    // Extraer mes y año del campo "edicion" (ej: "Mayo 2026")
    const mesesES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const partes  = (data.edicion || '').toLowerCase().split(' ');
    const mesEdicion  = mesesES.indexOf(partes[0]) + 1 || null;
    const anioEdicion = parseInt(partes[1]) || null;
    setTimeout(() => {
      cargarStatsAutomaticos(mesEdicion, anioEdicion);
      iniciarLibro();
    }, 600);
  }

  async function cargarStatsAutomaticos(mesRevista, anioRevista) {
  const mes  = mesRevista  ?? new Date().getMonth() + 1;
  const anio = anioRevista ?? new Date().getFullYear();

  // 1. REPORTES DE RIESGO — todos los registros del mes/año
  const { count: totalReportes } = await sb
    .from('safety_alerts')
    .select('id', { count: 'exact', head: true })
    .eq('mes_registro',  mes)
    .eq('anio_registro', anio);

  // 2. NEAR MISS RESUELTOS — solo los de tipo "Incidente" del mes/año
  const { count: totalNearMiss } = await sb
    .from('safety_alerts')
    .select('id', { count: 'exact', head: true })
    .eq('mes_registro',  mes)
    .eq('anio_registro', anio)
    .eq('tipo_evento', 'Incidente');

  // 3. DÍAS SIN ACCIDENTE — días desde el último accidente registrado
  const { data: ultimoAccidente } = await sb
    .from('safety_alerts')
    .select('fecha_evento')
    .eq('tipo_evento', 'Accidente')
    .order('fecha_evento', { ascending: false })
    .limit(1)
    .single();

  let diasSinAccidente = 0;
  if (ultimoAccidente?.fecha_evento) {
    const hoy        = new Date();
    const fechaAcc   = new Date(ultimoAccidente.fecha_evento);
    const diffMs     = hoy - fechaAcc;
    diasSinAccidente = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  } else {
    // Sin accidentes registrados, contar desde inicio del año
    diasSinAccidente = Math.floor((new Date() - new Date(anio, 0, 1)) / (1000 * 60 * 60 * 24));
  }

  // 4. Pintar en la revista
  const setEl = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.textContent = val ?? 0;
  };
  setEl('pv-stat-dias', diasSinAccidente);
  setEl('pv-stat-obs',  totalReportes ?? 0);
  setEl('pv-stat-acc',  totalNearMiss ?? 0);
}

  async function deleteEdition(id) {
    if (!isAdmin) return;
    if (!confirm('¿Eliminar esta edición? Esta acción no se puede deshacer.')) return;
    const { error } = await sb.from('qhse_editions').delete().eq('id', id);
    if (error) { showToast('❌ Error al eliminar', 'error'); return; }
    showToast('🗑️ Edición eliminada');
    cargarRevista();
  }

  // ── ADMIN: LOAD STATS ──
  async function loadStats() {
    const [edCount, nmCount, gCount] = await Promise.all([
      sb.from('qhse_editions').select('id', {count:'exact',head:true}),
      sb.from('qhse_near_miss').select('id', {count:'exact',head:true}),
      sb.from('qhse_editions').select('guardian_nombre').not('guardian_nombre','is',null)
    ]);
    document.getElementById('stat-ediciones').textContent    = edCount.count ?? '—';
    document.getElementById('stat-nm-total').textContent     = nmCount.count ?? '—';
    document.getElementById('stat-guardianes').textContent   = gCount.data?.filter(g=>g.guardian_nombre).length ?? '—';
    document.getElementById('stat-last-update').textContent  = new Date().toLocaleDateString('es-MX');
  }

  // ── UI HELPERS ──
  function toggleAdminPanel() {
    if (!isAdmin) { showToast('⛔ Acceso restringido a administradores', 'error'); return; }
    document.getElementById('admin-panel').classList.toggle('hidden');
    if (!document.getElementById('admin-panel').classList.contains('hidden')) {
      loadEditions();
      loadStats();
      document.getElementById('admin-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function switchAdminTab(tabId, btn) {
    document.querySelectorAll('.admin-tab-content').forEach(t => t.classList.add('hidden'));
    document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.remove('hidden');
    btn.classList.add('active');
  }

  function scrollToSection(id) {
    document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function closeModal(id) {
    document.getElementById(id).classList.add('hidden');
  }

  let toastTimer = null;
  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    const colors = { success: '#00c8ff', error: '#ef4444', warn: '#f59e0b' };
    toast.style.borderLeftColor = colors[type] || colors.success;
    document.getElementById('toast-msg').textContent = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3800);
  }

  init();
</script>

</body>
</html>
