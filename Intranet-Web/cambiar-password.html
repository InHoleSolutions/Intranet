<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar Contraseña | In Hole Solutions</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-slide { animation: fadeSlide 0.35s ease-out; }
  </style>
</head>
<body class="min-h-screen flex">

  <!-- ── Panel izquierdo (solo md+) ── -->
  <div class="hidden md:flex md:w-1/2 lg:w-2/5 bg-[#e31e24] relative overflow-hidden flex-col items-center justify-center p-12">
    <div class="absolute -top-16 -left-16 w-72 h-72 rounded-full border-[50px] border-white/5"></div>
    <div class="absolute -bottom-20 -right-20 w-96 h-96 rounded-full border-[60px] border-white/5"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] rounded-full bg-white/5 blur-3xl pointer-events-none"></div>

    <div class="relative z-10 text-center text-white">
      <img src="../assets/images/logo/logo-dark.svg" alt="In Hole Solutions"
           onerror="this.src='../assets/images/logo/logo-dark.png'"
           class="h-20 w-auto mx-auto mb-10 brightness-0 invert">
      <h1 class="text-2xl lg:text-3xl font-bold tracking-tight mb-3">Seguridad de Cuenta</h1>
      <p class="text-sm text-white/70 leading-relaxed max-w-xs mx-auto">
        Por tu seguridad, la contraseña debe renovarse cada 6 meses.
      </p>
    </div>
  </div>

  <!-- ── Panel derecho: formulario ── -->
  <div class="flex-1 flex items-center justify-center bg-slate-50 p-4 sm:p-8 min-h-screen md:min-h-0">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-md p-6 sm:p-10">

      <!-- Logo solo en móvil -->
      <div class="flex justify-center mb-8 md:hidden">
        <img src="../assets/images/logo/logo-dark.svg" alt="In Hole Solutions"
             onerror="this.src='../assets/images/logo/logo-dark.png'"
             class="h-14 w-auto">
      </div>

      <div class="mb-7">
        <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Cambiar Contraseña</h2>
        <p class="text-slate-400 text-sm mt-1">Elige una nueva contraseña para tu cuenta</p>
      </div>

      <!-- Mensaje de estado -->
      <div id="status-msg" class="hidden fade-slide mb-5"></div>

      <!-- Formulario -->
      <form id="passwordForm" class="space-y-5">

        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Nueva Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm pointer-events-none">
              <i class="fas fa-lock"></i>
            </span>
            <input type="password" id="nuevaPassword" required minlength="8" autocomplete="new-password"
              placeholder="Mínimo 8 caracteres"
              class="w-full pl-10 pr-10 py-3 border border-slate-200 rounded-xl bg-slate-50 text-slate-800 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-[#e31e24] transition duration-200">
            <button type="button" data-target="nuevaPassword" data-icon="eyeIcon1"
              class="toggle-password absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-[#e31e24] transition-colors duration-200">
              <i class="fas fa-eye text-sm" id="eyeIcon1"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Confirmar Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm pointer-events-none">
              <i class="fas fa-lock"></i>
            </span>
            <input type="password" id="confirmarPassword" required minlength="8" autocomplete="new-password"
              placeholder="Repite la contraseña"
              class="w-full pl-10 pr-10 py-3 border border-slate-200 rounded-xl bg-slate-50 text-slate-800 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-[#e31e24] transition duration-200">
            <button type="button" data-target="confirmarPassword" data-icon="eyeIcon2"
              class="toggle-password absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-[#e31e24] transition-colors duration-200">
              <i class="fas fa-eye text-sm" id="eyeIcon2"></i>
            </button>
          </div>
        </div>

        <ul class="text-xs text-slate-400 space-y-1 pl-1">
          <li id="check-length"><i class="fas fa-circle text-[6px] mr-2 align-middle"></i>Mínimo 8 caracteres</li>
          <li id="check-match"><i class="fas fa-circle text-[6px] mr-2 align-middle"></i>Las contraseñas coinciden</li>
        </ul>

        <button type="submit" id="submitBtn"
          class="w-full bg-[#e31e24] hover:bg-[#b3161b] active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-red-200 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed mt-1">
          <span id="btnText">Actualizar Contraseña</span>
        </button>

        <button type="button" id="cancelarBtn"
          class="w-full text-slate-400 text-sm font-semibold py-2 hover:text-slate-600 transition-colors duration-200">
          Cancelar y volver
        </button>

      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script type="module">
    import { supabaseClient } from './Js/supabase-config.js';

    // Toggle mostrar/ocultar contraseña (para ambos campos)
    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const icon  = document.getElementById(btn.dataset.icon);
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'fas fa-eye-slash text-sm';
        } else {
          input.type = 'password';
          icon.className = 'fas fa-eye text-sm';
        }
      });
    });

    const form         = document.getElementById('passwordForm');
    const statusMsg    = document.getElementById('status-msg');
    const submitBtn    = document.getElementById('submitBtn');
    const btnText      = document.getElementById('btnText');
    const nuevaInput   = document.getElementById('nuevaPassword');
    const confirmInput = document.getElementById('confirmarPassword');
    const checkLength  = document.getElementById('check-length');
    const checkMatch   = document.getElementById('check-match');

    // Verificar que haya sesión activa; si no, mandar al login
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'intranet-login.html';
    }

    function actualizarChecks() {
      const nueva = nuevaInput.value;
      const confirmar = confirmInput.value;

      if (nueva.length >= 8) {
        checkLength.classList.add('text-emerald-500');
        checkLength.classList.remove('text-slate-400');
      } else {
        checkLength.classList.remove('text-emerald-500');
        checkLength.classList.add('text-slate-400');
      }

      if (confirmar.length > 0 && nueva === confirmar) {
        checkMatch.classList.add('text-emerald-500');
        checkMatch.classList.remove('text-slate-400');
      } else {
        checkMatch.classList.remove('text-emerald-500');
        checkMatch.classList.add('text-slate-400');
      }
    }

    nuevaInput.addEventListener('input', actualizarChecks);
    confirmInput.addEventListener('input', actualizarChecks);

    function showError(texto) {
      statusMsg.className = 'fade-slide mb-5 p-4 rounded-xl text-sm font-bold text-center bg-red-50 text-red-700 border border-red-100';
      statusMsg.innerText = texto;
      statusMsg.classList.remove('hidden');
    }

    function showSuccess(html) {
      statusMsg.className = 'fade-slide mb-5 p-4 rounded-xl bg-emerald-50 border border-emerald-100';
      statusMsg.innerHTML = html;
      statusMsg.classList.remove('hidden');
    }

    document.getElementById('cancelarBtn').addEventListener('click', () => {
      window.location.href = 'dashboard.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusMsg.className = 'hidden';

      const nuevaPassword     = nuevaInput.value;
      const confirmarPassword = confirmInput.value;

      if (nuevaPassword.length < 8) {
        showError('LA CONTRASEÑA DEBE TENER AL MENOS 8 CARACTERES');
        return;
      }
      if (nuevaPassword !== confirmarPassword) {
        showError('LAS CONTRASEÑAS NO COINCIDEN');
        return;
      }

      submitBtn.disabled = true;
      btnText.innerText = 'Actualizando...';

      try {
        // 1. Actualizar la contraseña en Supabase Auth
        const { error: authError } = await supabaseClient.auth.updateUser({
          password: nuevaPassword
        });

        if (authError) throw authError;

        // 2. Registrar la fecha del cambio en la tabla perfiles
        const { data: { session: sesionActual } } = await supabaseClient.auth.getSession();

        const { error: perfilError } = await supabaseClient
          .from('perfiles')
          .update({
            fecha_ultimo_cambio_password: new Date().toISOString(),
            password_temporal: false,
            fecha_ultima_alerta_enviada: null
          })
          .eq('id', sesionActual.user.id);

        if (perfilError) throw perfilError;

        // 3. Éxito
        form.style.opacity = '0';
        showSuccess(`
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-emerald-100 flex items-center justify-center flex-shrink-0">
              <i class="fas fa-check text-emerald-600 text-xs"></i>
            </div>
            <div>
              <p class="text-emerald-900 font-bold text-sm">Contraseña actualizada</p>
              <p class="text-emerald-600 text-xs mt-0.5">Redirigiendo al panel principal...</p>
            </div>
          </div>
        `);

        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1800);

      } catch (error) {
        console.error('Error:', error);
        if (error.message && error.message.toLowerCase().includes('at least')) {
          showError('LA CONTRASEÑA NO CUMPLE LOS REQUISITOS MÍNIMOS');
        } else if (error.message && error.message.toLowerCase().includes('same')) {
          showError('LA NUEVA CONTRASEÑA DEBE SER DIFERENTE A LA ACTUAL');
        } else {
          showError('OCURRIÓ UN ERROR, INTENTA DE NUEVO');
        }
        submitBtn.disabled = false;
        btnText.innerText = 'Actualizar Contraseña';
      }
    });
  </script>

</body>
</html>
