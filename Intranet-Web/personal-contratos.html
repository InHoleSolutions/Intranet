<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal por Contrato | In Hole Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <style>
    body { font-family: 'Calibri', 'Carlito', Arial, sans-serif; }
    #header-componente { display: block; }
    /* ── Necesario para header.html ── */
    .glass-nav { background: rgba(255, 255, 255, 0.97); backdrop-filter: blur(16px); }
    @media (min-width: 1024px) {
      .dropdown:hover > .dropdown-menu { display: block; animation: fadeIn 0.2s ease-out; }
      .group\/sub:hover > .submenu-content { display: block; }
    }
    .mobile-active { display: block !important; }
    .table-container::-webkit-scrollbar { height: 6px; }
    .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.25s ease-out both; }

    /* Líneas verticales ligeras entre columnas */
    tbody td { border-left: 1px solid #f8f7f7; }
    tbody td:first-child { border-left: none; }
  </style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex flex-col">
  <div id="header-componente"></div>

  <main class="w-full max-w-[1600px] mx-auto px-6 sm:px-10 lg:px-16 py-8 flex-1 pt-24 lg:pt-36 3xl:pt-40">

    <!-- Encabezado -->
    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-8">
      <div>
        <h2 class="text-3xl font-bold text-slate-800 tracking-tight mt-2">Gestión de Personal por Contrato</h2>
        <p class="text-slate-500 text-sm mt-1">Asignación de personal por contrato, alcance y requisitos.</p>
      </div>
      <button id="btn-nuevo" onclick="abrirModal()"
        class="bg-[#e31e24] hover:bg-[#b9171c] text-white font-bold text-sm px-5 py-3 rounded-xl shadow-sm transition flex items-center gap-2 self-start md:self-auto">
        <i class="fas fa-plus"></i> Nuevo contrato
      </button>
    </div>

    <!-- Resumen -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Clientes</p>
        <p id="kpi-clientes" class="text-3xl font-black text-slate-800 mt-1">—</p>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Contratos</p>
        <p id="kpi-contratos" class="text-3xl font-black text-slate-800 mt-1">—</p>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Personas asignadas</p>
        <p id="kpi-personas" class="text-3xl font-black text-[#e31e24] mt-1">—</p>
      </div>
    </div>

    <!-- Filtros -->
    <div class="bg-white rounded-2xl border border-slate-200 p-4 mb-6 flex flex-col md:flex-row gap-3">
      <div class="relative flex-1">
        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input id="buscar" type="text" placeholder="Buscar por cliente, contrato, alcance o persona..."
          class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#e31e24]/30 focus:border-[#e31e24]">
      </div>
      <select id="filtro-cliente"
        class="md:w-64 px-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#e31e24]/30">
        <option value="">Todos los clientes</option>
      </select>
    </div>

    <!-- Tabla -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="table-container overflow-x-auto">
        <table class="w-full text-sm table-fixed min-w-[1380px]">
          <colgroup>
            <col style="width:125px"> <!-- Cliente -->
            <col style="width:95px"> <!-- No. Contrato -->
            <col style="width:200px"> <!-- Alcance -->
            <col style="width:230px"> <!-- Servicio -->
            <col style="width:150px"> <!-- Personal IHS -->
            <col style="width:180px"> <!-- Puesto -->
            <col style="width:240px"> <!-- Requisitos -->
            <col style="width:90px"> <!-- Fecha alta -->
            <col style="width:70px">  <!-- Acciones -->
          </colgroup>
          <thead class="bg-slate-800 text-white text-xs uppercase tracking-widest">
            <tr>
              <th class="px-4 py-3 text-left">Cliente</th>
              <th class="px-2 py-3 text-left">No. Contrato</th>
              <th class="px-4 py-3 text-left">Alcance</th>
              <th class="px-4 py-3 text-left">Servicio</th>
              <th colspan="2" class="px-4 py-3 text-left">
                <div class="grid grid-cols-[126px_1fr] gap-x-4">
                  <span>Personal IHS</span>
                  <span>Puesto</span>
                </div>
              </th>
              <th class="px-4 py-3 text-left">Requisitos</th>
              <th class="px-2 py-3 text-left">Fecha alta Cto</th>
              <th class="px-2 py-3 text-center" title="Acciones"><i class="fas fa-ellipsis"></i></th>
            </tr>
          </thead>
          <tbody id="tabla-body" class="text-slate-700"></tbody>
        </table>
      </div>
      <div id="estado-vacio" class="hidden p-10 text-center text-slate-400 text-sm">
        <i class="fas fa-folder-open text-3xl mb-3 block"></i>
        No se encontraron contratos.
      </div>
    </div>
  </main>

  <!-- Modal crear / editar -->
  <div id="modal" class="hidden fixed inset-0 z-[300] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[92vh] overflow-y-auto fade-in">
      <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
        <h3 id="modal-titulo" class="text-lg font-bold text-slate-800">Nuevo contrato</h3>
        <button onclick="cerrarModal()" class="text-slate-400 hover:text-slate-700 text-xl"><i class="fas fa-times"></i></button>
      </div>
      <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-1">Cliente *</label>
          <input id="f-cliente" list="lista-clientes" type="text" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#e31e24]/30" placeholder="Ej. SLB">
          <datalist id="lista-clientes"></datalist>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-1">No. Contrato *</label>
          <input id="f-numero" type="text" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#e31e24]/30">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-1">Alcance</label>
          <textarea id="f-alcance" rows="3" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#e31e24]/30" placeholder="Descripción detallada del alcance"></textarea>
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-1">Servicio</label>
          <input id="f-servicio" type="text" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#e31e24]/30" placeholder="Ej. Servicios de Torque">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-1">Personal IHS y Puesto</label>
          <div class="flex flex-col sm:flex-row gap-2">
            <input id="in-personal" type="text" class="flex-1 px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#e31e24]/30" placeholder="Nombre completo">
            <input id="in-puesto" type="text" class="flex-1 px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#e31e24]/30" placeholder="Puesto (Enter para agregar)">
            <button type="button" onclick="agregarChip('personal')" class="px-4 py-2.5 rounded-xl bg-slate-800 text-white text-sm font-bold hover:bg-slate-700">Agregar</button>
          </div>
          <div id="chips-personal" class="flex flex-wrap gap-2 mt-2"></div>
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-1">Requisitos</label>
          <div class="flex gap-2">
            <input id="in-requisitos" type="text" class="flex-1 px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#e31e24]/30" placeholder="Ej. RigPass y presiona Enter">
            <button type="button" onclick="agregarChip('requisitos')" class="px-4 rounded-xl bg-slate-800 text-white text-sm font-bold hover:bg-slate-700">Agregar</button>
          </div>
          <div id="chips-requisitos" class="flex flex-wrap gap-2 mt-2"></div>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-1">Fecha alta del contrato</label>
          <input id="f-fecha" type="date" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#e31e24]/30">
        </div>
      </div>
      <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-3">
        <button onclick="cerrarModal()" class="px-5 py-2.5 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-100">Cancelar</button>
        <button id="btn-guardar" onclick="guardarContrato()" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-[#e31e24] text-white hover:bg-[#b9171c]">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 right-6 z-[400] bg-slate-800 text-white text-sm font-semibold px-5 py-3 rounded-xl shadow-xl"></div>

  <div id="footer-componente"></div>

  <script>
    const SUPABASE_URL = 'https://bgqlvkvlscujikhzzazf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_S5G17esnd47Gw9hO3rTfbA_cTxVtG-P';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>

  <script>
    // ── Header / Footer (mismo patrón que dashboard.html) ──
    function insertarHTMLConScripts(contenedorId, html) {
      const contenedor = document.getElementById(contenedorId);
      contenedor.innerHTML = html;
      contenedor.querySelectorAll('script').forEach(viejo => {
        const nuevo = document.createElement('script');
        if (viejo.src) nuevo.src = viejo.src; else nuevo.textContent = viejo.textContent;
        viejo.replaceWith(nuevo);
      });
    }
    fetch('header.html').then(r => r.text()).then(h => {
      insertarHTMLConScripts('header-componente', h);
      iniciar();
    });
    fetch('footer.html').then(r => r.text()).then(h => {
      document.getElementById('footer-componente').innerHTML = h;
      const y = document.getElementById('footer-year'); if (y) y.textContent = new Date().getFullYear();
    });

    // ── Funciones que el header necesita ──
    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      window.location.href = '../index.html';
    }
    function mostrarInicio() { window.location.href = 'dashboard.html'; }
    function obtenerSaludo() {
      const hora = new Date().getHours();
      if (hora >= 6 && hora < 12) return "Buenos días";
      if (hora >= 12 && hora < 19) return "Buenas tardes";
      return "Buenas noches";
    }
    function toggleMenu(id) {
      const el = document.getElementById(id);
      el.classList.toggle('hidden');
      el.classList.toggle('block');
    }
    function toggleSubmenu(btn) {
      const menu = btn.nextElementSibling;
      menu.classList.toggle('hidden');
      const icon = btn.querySelector('.fa-chevron-down, .fa-chevron-right');
      if (icon) icon.classList.toggle('rotate-180');
      event.stopPropagation();
    }
    window.addEventListener('resize', () => {
      const nav = document.getElementById('mobile-nav');
      if (nav && window.innerWidth >= 1024) { nav.classList.remove('hidden'); nav.classList.add('block'); }
    });

    // ── Latido: marcar que este usuario está activo ──
    let intervaloLatido = null;
    function iniciarLatido(userId) {
      if (intervaloLatido) return;
      const enviarLatido = () => {
        if (document.visibilityState === 'visible') {
          supabaseClient.from('perfiles')
            .update({ ultima_actividad: new Date().toISOString() })
            .eq('id', userId).then(() => {}).catch(() => {});
        }
      };
      enviarLatido();
      intervaloLatido = setInterval(enviarLatido, 30000);
    }

    // ── Estado ──
    let contratos = [];
    let editandoId = null;
    let chips = { personal: [], requisitos: [] };

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.remove('hidden');
      clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hidden'), 2800);
    }

    // ── Acceso: solo QHSE ──
    async function iniciar() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'intranet-login.html'; return; }

      const { data: perfil } = await supabaseClient.from('perfiles').select('id, rol, nombre_completo').eq('id', session.user.id).single();
      if (!perfil || !['QHSE', 'qhse'].includes(perfil.rol)) {
        window.location.href = 'dashboard.html';
        return;
      }
      await cargarContratos();
        // ── Nombre del usuario en el header ──
      const welcomeEl = document.getElementById('user-welcome');
      if (welcomeEl) welcomeEl.innerHTML = `${obtenerSaludo()}, <span class="text-[#2563eb]">${perfil.nombre_completo}</span>`;
      iniciarLatido(perfil.id);
      document.getElementById('buscar').addEventListener('input', render);
      document.getElementById('filtro-cliente').addEventListener('change', render);
      document.getElementById('in-puesto').addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); agregarChip('personal'); }
      });
      ['personal', 'requisitos'].forEach(tipo => {
        document.getElementById('in-' + tipo).addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); agregarChip(tipo); }
        });
      });
    }

    async function cargarContratos() {
      const { data, error } = await supabaseClient
        .from('contratos_personal').select('*')
        .order('cliente', { ascending: true }).order('numero_contrato', { ascending: true });
      if (error) { console.error(error); toast('Error al cargar los contratos'); return; }
      contratos = data || [];
      llenarFiltroClientes();
      render();
    }

    function llenarFiltroClientes() {
      const clientes = [...new Set(contratos.map(c => c.cliente))].sort();
      const sel = document.getElementById('filtro-cliente');
      const actual = sel.value;
      sel.innerHTML = '<option value="">Todos los clientes</option>' +
        clientes.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      sel.value = clientes.includes(actual) ? actual : '';
      document.getElementById('lista-clientes').innerHTML = clientes.map(c => `<option value="${esc(c)}">`).join('');
    }

    function formatearFecha(f) {
      if (!f) return '—';
      const [y, m, d] = f.split('-');
      return `${d}/${m}/${y}`;
    }

    function render() {
      const q = document.getElementById('buscar').value.trim().toLowerCase();
      const cli = document.getElementById('filtro-cliente').value;

      const lista = contratos.filter(c => {
        if (cli && c.cliente !== cli) return false;
        if (!q) return true;
        const texto = [c.cliente, c.numero_contrato, c.servicio, c.alcance, ...(c.personal_puestos || []).flatMap(p => [p.nombre, p.puesto]), ...(c.requisitos || [])].join(' ').toLowerCase();
        return texto.includes(q);
      });

      // KPIs (sobre el total, no sobre el filtro)
      document.getElementById('kpi-clientes').textContent = new Set(contratos.map(c => c.cliente)).size;
      document.getElementById('kpi-contratos').textContent = contratos.length;
      document.getElementById('kpi-personas').textContent = new Set(contratos.flatMap(c => (c.personal_puestos || []).map(p => p.nombre.toLowerCase()))).size;

      const body = document.getElementById('tabla-body');
      document.getElementById('estado-vacio').classList.toggle('hidden', lista.length > 0);

      // Agrupar por cliente para usar rowspan
      const grupos = {};
      lista.forEach(c => (grupos[c.cliente] = grupos[c.cliente] || []).push(c));

      body.innerHTML = Object.entries(grupos).map(([cliente, items]) =>
        items.map((c, i) => {
          const equipo = c.personal_puestos || [];
          const personal = equipo.length
            ? `<div class="grid grid-cols-[126px_1fr] gap-x-4 gap-y-1">${equipo.map(p => `
                <span class="flex items-center gap-2 min-h-[2.75rem] bg-slate-100 rounded-lg px-2.5 py-1 text-xs font-semibold text-slate-700"><i class="fas fa-user text-[10px] text-slate-400"></i>${esc(p.nombre)}</span>
                <div class="flex items-center text-xs font-semibold text-slate-600">${esc(p.puesto) || '<span class="text-slate-300">—</span>'}</div>`).join('')}</div>`
            : '<span class="text-slate-300 text-xs italic">Sin asignar</span>';
          const reqs = (c.requisitos || []).length
            ? `<div class="flex flex-wrap gap-1">${c.requisitos.map(r => `<span class="bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-2 py-0.5 text-xs font-semibold">${esc(r)}</span>`).join('')}</div>`
            : '<span class="text-slate-300">—</span>';
          const celdaCliente = i === 0
            ? `<td rowspan="${items.length}" class="px-4 py-3 font-black text-slate-800 align-middle border-r border-slate-100 bg-slate-50">${esc(cliente)}</td>` : '';
          return `<tr class="border-t-2 border-slate-300 hover:bg-slate-50/60 transition">
            ${celdaCliente}
            <td class="px-2 py-3 font-semibold align-middle">${esc(c.numero_contrato)}</td>
            <td class="px-4 py-3 align-middle">${esc(c.alcance) || '<span class="text-slate-300">—</span>'}</td>
            <td class="px-4 py-3 align-middle font-semibold">${esc(c.servicio) || '<span class="text-slate-300">—</span>'}</td>
            <td colspan="2" class="px-4 py-3 align-middle">${personal}</td>
            <td class="px-4 py-3 align-middle">${reqs}</td>
            <td class="px-2 py-3 align-middle whitespace-nowrap">${formatearFecha(c.fecha_alta)}</td>
            <td class="px-2 py-3 align-middle">
              <div class="flex flex-col items-center gap-3">
                <button data-editar="${c.id}" class="text-slate-400 hover:text-blue-600" title="Editar"><i class="fas fa-pen"></i></button>
                <button data-borrar="${c.id}" class="text-slate-400 hover:text-[#e31e24]" title="Eliminar"><i class="fas fa-trash"></i></button>
              </div>
            </td>
          </tr>`;
        }).join('')
      ).join('');

      body.querySelectorAll('[data-editar]').forEach(b => b.onclick = () => abrirModal(b.dataset.editar));
      body.querySelectorAll('[data-borrar]').forEach(b => b.onclick = () => eliminarContrato(b.dataset.borrar));
    }

    // ── Modal ──
    function renderChips(tipo) {
      document.getElementById('chips-' + tipo).innerHTML = chips[tipo].map((v, i) => {
        const etiqueta = tipo === 'personal'
          ? `${esc(v.nombre)}${v.puesto ? ` <span class="text-slate-400 font-normal">· ${esc(v.puesto)}</span>` : ''}`
          : esc(v);
        return `<span class="inline-flex items-center gap-2 bg-slate-100 rounded-lg px-3 py-1 text-xs font-semibold text-slate-700">${etiqueta}
          <button type="button" onclick="quitarChip('${tipo}', ${i})" class="text-slate-400 hover:text-[#e31e24]"><i class="fas fa-times"></i></button></span>`;
      }).join('');
    }
    function agregarChip(tipo) {
      const input = document.getElementById('in-' + tipo);
      const v = input.value.trim();
      if (tipo === 'personal') {
        const puestoInput = document.getElementById('in-puesto');
        if (v && !chips.personal.some(x => x.nombre.toLowerCase() === v.toLowerCase())) {
          chips.personal.push({ nombre: v, puesto: puestoInput.value.trim() });
          renderChips('personal');
        }
        input.value = ''; puestoInput.value = ''; input.focus();
        return;
      }
      if (v && !chips[tipo].some(x => x.toLowerCase() === v.toLowerCase())) { chips[tipo].push(v); renderChips(tipo); }
      input.value = ''; input.focus();
    }
    function quitarChip(tipo, i) { chips[tipo].splice(i, 1); renderChips(tipo); }

    function abrirModal(id = null) {
      editandoId = id;
      const c = id ? contratos.find(x => String(x.id) === String(id)) : null;
      document.getElementById('modal-titulo').textContent = c ? 'Editar contrato' : 'Nuevo contrato';
      document.getElementById('f-cliente').value = c?.cliente || '';
      document.getElementById('f-numero').value = c?.numero_contrato || '';
      document.getElementById('f-servicio').value = c?.servicio || '';
      document.getElementById('f-alcance').value = c?.alcance || '';
      document.getElementById('f-fecha').value = c?.fecha_alta || '';
      chips.personal = (c?.personal_puestos || []).map(p => ({ ...p }));
      chips.requisitos = [...(c?.requisitos || [])];
      renderChips('personal'); renderChips('requisitos');
      document.getElementById('modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    function cerrarModal() {
      document.getElementById('modal').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    async function guardarContrato() {
      // Incluye lo que quedó escrito sin presionar Enter
      ['personal', 'requisitos'].forEach(t => { if (document.getElementById('in-' + t).value.trim()) agregarChip(t); });

      const cliente = document.getElementById('f-cliente').value.trim().toUpperCase();
      const numero = document.getElementById('f-numero').value.trim();
      if (!cliente || !numero) { toast('Cliente y No. Contrato son obligatorios'); return; }

      const registro = {
        cliente,
        numero_contrato: numero,
        servicio: document.getElementById('f-servicio').value.trim() || null,
        alcance: document.getElementById('f-alcance').value.trim() || null,
        personal_puestos: chips.personal,
        requisitos: chips.requisitos,
        fecha_alta: document.getElementById('f-fecha').value || null
      };

      const btn = document.getElementById('btn-guardar');
      btn.disabled = true; btn.textContent = 'Guardando...';
      const { error } = editandoId
        ? await supabaseClient.from('contratos_personal').update(registro).eq('id', editandoId)
        : await supabaseClient.from('contratos_personal').insert(registro);
      btn.disabled = false; btn.textContent = 'Guardar';

      if (error) { console.error(error); toast(error.code === '23505' ? 'Ese contrato ya existe para este cliente' : 'Error al guardar'); return; }
      cerrarModal();
      toast('Contrato guardado');
      await cargarContratos();
    }

    async function eliminarContrato(id) {
      const c = contratos.find(x => String(x.id) === String(id));
      if (!confirm(`¿Eliminar el contrato ${c?.numero_contrato} de ${c?.cliente}?`)) return;
      const { error } = await supabaseClient.from('contratos_personal').delete().eq('id', id);
      if (error) { console.error(error); toast('Error al eliminar'); return; }
      toast('Contrato eliminado');
      await cargarContratos();
    }
  </script>
</body>
</html>
